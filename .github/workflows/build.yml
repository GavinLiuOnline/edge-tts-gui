name: Build & Release

on:
  workflow_dispatch:            # 手动触发
  push:
    tags: ["v*"]                # 推送 v* 标签时自动构建并发布 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: ./build_linux.sh
            artifact: linux
          - os: windows-latest
            script: build_windows.bat
            artifact: windows
          - os: macos-latest
            script: ./build_macos.sh
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux system dependencies (WebKit2GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: chmod +x build_macos.sh && ./build_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tts-ui-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
